name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Only run the secret-dependent install on same-repo PRs. Fork PRs get no
    # secrets from GitHub by default, so this just skips a guaranteed-to-fail run
    # rather than leaking anything. (Never switch this to pull_request_target.)
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Audit dependencies
        # Fail on any high/critical advisory. The allowlist is EMPTY on purpose:
        # every advisory is currently fixed by a pinned leaf in `overrides`.
        #
        # GHSA-mh99-v99m-4gvg (brace-expansion) used to be allowlisted because
        # its only patch was 5.0.8, which is ESM-named-export only and crashes
        # the minimatch@3/8/9 that eslint and opennext's @node-minify require.
        # Patches now exist in EVERY major line (1.1.18 / 2.1.4 / 5.0.9), so the
        # override pins each range within its own major and nothing has to be
        # tolerated. Keep it that way: add to `overrides` before reaching for an
        # allowlist entry.
        run: |
          npm audit --audit-level=high --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            const allow = new Set([]); // 空を維持すること（上のコメント参照）
            const id = u => (u || "").split("/").pop();
            const bad = Object.values(a.vulnerabilities || {}).filter(v =>
              ["high", "critical"].includes(v.severity) &&
              (v.via || []).some(x => typeof x === "object" && !allow.has(id(x.url)))
            );
            if (bad.length) {
              console.error("Blocking high/critical advisories (not allowlisted):");
              for (const b of bad) console.error("  -", b.name, "=>",
                (b.via || []).filter(x => typeof x === "object").map(x => id(x.url)).join(", "));
              process.exit(1);
            }
            console.log("Audit OK — no high/critical advisories.");
          '
          rm -f audit.json

      - name: Sync OpenAPI specs
        # No monorepo / private packages in CI — fetch the public specs over HTTP.
        run: npm run sync-specs

      - name: Generate typed clients
        run: npm run generate

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx tsc -p tsconfig.json

      - name: Verify codegen is deterministic
        # Re-running the generator must produce byte-identical output. (src/generated
        # is gitignored under contribution model B, so compare hashes, not git diff.)
        run: |
          before=$(find src/generated -type f | sort | xargs cat | sha256sum)
          npm run generate
          after=$(find src/generated -type f | sort | xargs cat | sha256sum)
          if [ "$before" != "$after" ]; then
            echo "::error::Generated clients are not deterministic — generate.mjs produced different output on a second run.";
            exit 1;
          fi
